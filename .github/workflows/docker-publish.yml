name: Build and publish to GHCR

# Pushes ghcr.io/yogurut/mijialan-nas:latest (and :<git sha>) on every push
# to main, and on manual dispatch. No personal token is stored anywhere:
# the workflow uses the automatic GITHUB_TOKEN with packages:write.
# The image is built for linux/amd64 only - that is what UGREEN DX4600
# (Intel N5105, x86_64) needs.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/yogurut/mijialan-nas
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
